name: Check annual HCD housing delivery

on:
  workflow_dispatch:
    inputs:
      force:
        description: Recheck unchanged source metadata (validation still required)
        type: boolean
        default: false
  schedule:
    - cron: "47 14 15 7,10 *"

permissions:
  contents: write
  actions: write

concurrency:
  # Serialize with Pages, which also commits public data.
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Read the latest state after acquiring the shared concurrency group.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate HCD pipeline
        run: python -m unittest tests.test_hcd_pipeline
      - name: Check and validate annual data
        id: refresh
        env:
          HCD_FORCE: ${{ inputs.force }}
        run: |
          set +e
          if [ "$HCD_FORCE" = "true" ]; then
            python pipeline/update_hcd.py --force
          else
            python pipeline/update_hcd.py
          fi
          hcd_status=$?
          set -e
          echo "exit_code=$hcd_status" >> "$GITHUB_OUTPUT"
          python scripts/data_update_report.py record-status --output "$RUNNER_TEMP/annual-status.json" hcd="$hcd_status"
      - name: Record HCD update health
        id: health
        run: |
          python scripts/data_health.py --groups hcd \
            --statuses "$RUNNER_TEMP/annual-status.json" --run-id "$GITHUB_RUN_ID" \
            --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT"
      - name: Validate compact storage
        id: validation
        run: python scripts/check_storage.py
      - name: Commit HCD health and validated releases
        if: "${{ !cancelled() && steps.health.outcome == 'success' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          REFRESH_EXIT: ${{ steps.refresh.outputs.exit_code }}
        run: |
          release_changed=false
          git add .github/data-update-state.json
          if [ "$VALIDATION_OUTCOME" = "success" ] && [ "$REFRESH_EXIT" = "0" ]; then
            if ! git diff --quiet -- public/data/hcd/latest.json; then
              release_changed=true
            fi
            git add public/data/hcd
          fi
          if ! git diff --cached --quiet; then
            git config user.name "housing-market-lab[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: record HCD checks and validated releases"
            git push
          fi
          if [ "$release_changed" = "true" ]; then
            # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch explicitly.
            gh workflow run pages.yml --ref main -f deploy_only=true
            echo "Published an HCD release and requested deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HCD release deployed; see the data health summary." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce HCD update health
        env:
          HEALTH_ATTENTION: ${{ steps.health.outputs.attention }}
        run: |
          if [ "$HEALTH_ATTENTION" != "false" ]; then
            echo "::error::HCD freshness or update checks need attention."
            exit 1
          fi
