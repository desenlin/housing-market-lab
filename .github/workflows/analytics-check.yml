name: Analytics tracking audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Audit the deployed site as well as source coverage
        type: boolean
        default: true
  # Weekly live coverage runs in desenlin/desenlin.github.io. Local source and
  # manual audits stay here; pages.yml also audits successful deployments.
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: desenlin/desenlin.github.io/.github/workflows/analytics-reusable.yml@main
    with:
      live: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
