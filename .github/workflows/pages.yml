name: Validate data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Zillow's monthly files do not arrive on a fixed day. Two lightweight
    # attempts improve freshness while the last validated release stays live.
    - cron: "23 13 18 * *"
    - cron: "23 13 24 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependency and run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover tests

      - name: Refresh and validate provider data
        if: github.event_name != 'push'
        run: python pipeline/update_data.py

      - name: Commit a successful data release
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data; then
            echo "No new provider observations."
          else
            git config user.name "housing-market-lab[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: publish validated Zillow release"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint, test, and build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /housing-market-lab
        run: |
          npm run lint
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
