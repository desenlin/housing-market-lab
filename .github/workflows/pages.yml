name: Validate data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Providers publish independently and their monthly release order can
    # change. Staggered checks let any provider advance as soon as it is
    # available while each provider's last validated release stays live.
    - cron: "23 13 12 * *"
    - cron: "23 13 18 * *"
    - cron: "23 13 24 * *"
    - cron: "23 13 28 * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  DATA_REPORT_ISSUE: "5"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      data_report_ready: ${{ steps.refresh_report.outputs.notify || steps.pushed_report.outputs.notify }}
      data_report_b64: ${{ steps.refresh_report.outputs.report_b64 || steps.pushed_report.outputs.report_b64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependency and run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover tests

      - name: Refresh and validate provider data
        id: refresh
        if: github.event_name != 'push' || hashFiles('public/data/redfin/latest.json') == '' || hashFiles('public/data/realtor/inventory/latest.json') == '' || hashFiles('public/data/realtor/hotness/latest.json') == '' || hashFiles('public/data/cpi/latest.json') == '' || hashFiles('public/data/permits/history/latest.json') == '' || hashFiles('public/data/permits/provisional/latest.json') == '' || contains(github.event.head_commit.message, '[refresh-data]')
        env:
          FULL_REFRESH: ${{ contains(github.event.head_commit.message, '[refresh-data]') }}
        run: |
          python scripts/data_update_report.py snapshot --output "$RUNNER_TEMP/data-before.json"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$FULL_REFRESH" != "true" ]; then
            set +e
            python pipeline/update_redfin.py
            redfin_status=$?
            python pipeline/update_realtor.py
            realtor_status=$?
            python pipeline/update_cpi.py
            cpi_status=$?
            python pipeline/update_permits.py
            permits_status=$?
            set -e
            python scripts/data_update_report.py record-status \
              --output "$RUNNER_TEMP/data-refresh-status.json" \
              zillow=not_checked redfin="$redfin_status" realtor="$realtor_status" \
              cpi="$cpi_status" permits="$permits_status"
            if [ "$redfin_status" -ne 0 ]; then
              echo "::warning::Redfin refresh failed; retaining its prior validated release."
            fi
            if [ "$realtor_status" -ne 0 ]; then
              echo "::warning::Realtor.com refresh failed; retaining its prior validated releases."
            fi
            if [ "$cpi_status" -ne 0 ]; then
              echo "::warning::BLS CPI refresh failed; retaining its prior validated release."
            fi
            if [ "$permits_status" -ne 0 ]; then
              echo "::warning::Census building permits refresh failed; retaining its prior validated releases."
            fi
            if [ "$redfin_status" -ne 0 ] && [ "$realtor_status" -ne 0 ] && [ "$cpi_status" -ne 0 ] && [ "$permits_status" -ne 0 ]; then
              exit 1
            fi
            exit 0
          fi
          set +e
          python pipeline/update_data.py
          zillow_status=$?
          python pipeline/update_redfin.py
          redfin_status=$?
          python pipeline/update_realtor.py
          realtor_status=$?
          python pipeline/update_cpi.py
          cpi_status=$?
          python pipeline/update_permits.py
          permits_status=$?
          set -e
          python scripts/data_update_report.py record-status \
            --output "$RUNNER_TEMP/data-refresh-status.json" \
            zillow="$zillow_status" redfin="$redfin_status" realtor="$realtor_status" \
            cpi="$cpi_status" permits="$permits_status"
          if [ "$zillow_status" -ne 0 ]; then
            echo "::warning::Zillow refresh failed; retaining its prior validated release."
          fi
          if [ "$redfin_status" -ne 0 ]; then
            echo "::warning::Redfin refresh failed; retaining its prior validated release."
          fi
          if [ "$realtor_status" -ne 0 ]; then
            echo "::warning::Realtor.com refresh failed; retaining its prior validated releases."
          fi
          if [ "$cpi_status" -ne 0 ]; then
            echo "::warning::BLS CPI refresh failed; retaining its prior validated release."
          fi
          if [ "$permits_status" -ne 0 ]; then
            echo "::warning::Census building permits refresh failed; retaining its prior validated releases."
          fi
          if [ "$zillow_status" -ne 0 ] && [ "$redfin_status" -ne 0 ] && [ "$realtor_status" -ne 0 ] && [ "$cpi_status" -ne 0 ] && [ "$permits_status" -ne 0 ]; then
            exit 1
          fi

      - name: Enforce bounded storage policy
        run: |
          python pipeline/build_fact_engine.py
          python scripts/check_storage.py

      - name: Commit a successful data release
        if: steps.refresh.outcome == 'success'
        run: |
          if git status --porcelain -- public/data | grep -q .; then
            git config user.name "housing-market-lab[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: publish validated provider releases"
            git push
          else
            echo "No new provider observations."
          fi

      - name: Prepare successful refresh report
        id: refresh_report
        if: steps.refresh.outcome == 'success'
        env:
          REPORT_RECIPIENT: ${{ github.repository_owner }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/data_update_report.py report \
            --before "$RUNNER_TEMP/data-before.json" \
            --statuses "$RUNNER_TEMP/data-refresh-status.json" \
            --output "$RUNNER_TEMP/data-release-report.md" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --recipient "$REPORT_RECIPIENT" \
            --run-url "$REPORT_RUN_URL" \
            --site-url "https://desenlin.github.io/housing-market-lab/"

      - name: Prepare report for pushed data release
        id: pushed_report
        if: "${{ github.event_name == 'push' && steps.refresh.outcome == 'skipped' && !startsWith(github.event.head_commit.message, 'data: publish validated provider releases') }}"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REPORT_RECIPIENT: ${{ github.repository_owner }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/data_update_report.py git-report \
            --before-ref "$BEFORE_SHA" \
            --output "$RUNNER_TEMP/data-release-report.md" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --recipient "$REPORT_RECIPIENT" \
            --run-url "$REPORT_RUN_URL" \
            --site-url "https://desenlin.github.io/housing-market-lab/"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint, test, and build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /housing-market-lab
        run: |
          npm run lint
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Post successful data-release report
        if: needs.build.outputs.data_report_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_REPORT_B64: ${{ needs.build.outputs.data_report_b64 }}
        run: |
          report_path="$RUNNER_TEMP/data-release-report.md"
          printf '%s' "$DATA_REPORT_B64" | base64 --decode > "$report_path"
          gh issue comment "$DATA_REPORT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$report_path"
