name: Validate data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy validated committed data without refreshing providers
        type: boolean
        default: false
      recheck_history:
        description: Re-fetch permit history to check same-vintage corrections
        type: boolean
        default: false
  schedule:
    # Providers publish independently, and their release timing can differ.
    - cron: "23 13 12 * *"
    - cron: "23 13 18 * *"
    - cron: "23 13 24 * *"
    - cron: "23 13 28 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    outputs:
      health_attention: ${{ steps.health.outputs.attention }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Read the latest state after acquiring the shared concurrency group.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependency and run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover tests

      - name: Refresh and validate provider data
        id: refresh
        if: "${{ !inputs.deploy_only && (github.event_name != 'push' || hashFiles('public/data/latest.json') == '' || hashFiles('public/data/redfin/latest.json') == '' || hashFiles('public/data/realtor/inventory/latest.json') == '' || hashFiles('public/data/realtor/hotness/latest.json') == '' || hashFiles('public/data/cpi/latest.json') == '' || hashFiles('public/data/permits/history/latest.json') == '' || hashFiles('public/data/permits/provisional/latest.json') == '' || contains(github.event.head_commit.message, '[refresh-data]')) }}"
        env:
          RECHECK_HISTORY: ${{ inputs.recheck_history }}
          QUARTERLY_CHECK: ${{ github.event.schedule == '23 13 28 * *' }}
        run: |
          python scripts/data_update_report.py snapshot --output "$RUNNER_TEMP/data-before.json"
          set +e
          python pipeline/update_data.py
          zillow_status=$?
          python pipeline/update_redfin.py
          redfin_status=$?
          python pipeline/update_realtor.py
          realtor_status=$?
          python pipeline/update_cpi.py
          cpi_status=$?
          permit_args=()
          if [ "$RECHECK_HISTORY" = "true" ] || { [ "$QUARTERLY_CHECK" = "true" ] && [[ "$(date -u +%m)" =~ ^(01|04|07|10)$ ]]; }; then
            permit_args+=(--force-history)
          fi
          python pipeline/update_permits.py "${permit_args[@]}"
          permits_status=$?
          set -e
          python scripts/data_update_report.py record-status \
            --output "$RUNNER_TEMP/data-refresh-status.json" \
            zillow="$zillow_status" redfin="$redfin_status" realtor="$realtor_status" \
            cpi="$cpi_status" permits="$permits_status"
          if [ "$zillow_status" -ne 0 ]; then
            echo "::warning::Zillow refresh failed; retaining its prior validated release."
          fi
          if [ "$redfin_status" -ne 0 ]; then
            echo "::warning::Redfin refresh failed; retaining its prior validated release."
          fi
          if [ "$realtor_status" -ne 0 ]; then
            echo "::warning::Realtor.com refresh failed; retaining its prior validated releases."
          fi
          if [ "$cpi_status" -ne 0 ]; then
            echo "::warning::BLS CPI refresh failed; retaining its prior validated release."
          fi
          if [ "$permits_status" -ne 0 ]; then
            echo "::warning::Census building permits refresh failed; retaining its prior validated releases."
          fi

      - name: Audit source freshness and update failures
        id: health
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          health_args=()
          if [ "$REFRESH_OUTCOME" = "success" ]; then
            health_args+=(--statuses "$RUNNER_TEMP/data-refresh-status.json" --run-id "$GITHUB_RUN_ID")
          fi
          python scripts/data_health.py "${health_args[@]}" \
            --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT"

      - name: Enforce bounded storage policy
        id: storage
        run: |
          python pipeline/build_fact_engine.py
          python pipeline/prepare_market_brief.py --snapshot-only
          python scripts/check_storage.py

      - name: Commit checked releases and preserve update health
        if: "${{ !cancelled() && steps.health.outcome == 'success' && steps.refresh.outcome == 'success' }}"
        env:
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
        run: |
          git add .github/data-update-state.json
          if [ "$STORAGE_OUTCOME" = "success" ]; then
            git add public/data
          fi
          if ! git diff --cached --quiet; then
            git config user.name "housing-market-lab[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: record provider checks and validated releases [skip ci]"
            git push
          else
            echo "No new provider observations."
          fi

      - name: Write provider update summary
        if: steps.refresh.outcome == 'success'
        env:
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/data_update_report.py report \
            --before "$RUNNER_TEMP/data-before.json" \
            --statuses "$RUNNER_TEMP/data-refresh-status.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$REPORT_RUN_URL" \
            --site-url "https://desenlin.com/housing-market-lab/"

      - name: Summarize a pushed data release
        if: "${{ github.event_name == 'push' && steps.refresh.outcome == 'skipped' && !startsWith(github.event.head_commit.message, 'data: record provider checks and validated releases') }}"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/data_update_report.py git-report \
            --before-ref "$BEFORE_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --run-url "$REPORT_RUN_URL" \
            --site-url "https://desenlin.com/housing-market-lab/"

      - name: Record the validated site revision
        run: git rev-parse HEAD > "$RUNNER_TEMP/validated-site-sha.txt"

      - name: Preserve the validated revision for the brief workflow
        uses: actions/upload-artifact@v7
        with:
          name: validated-site-ref
          path: ${{ runner.temp }}/validated-site-sha.txt
          retention-days: 7
          if-no-files-found: error

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint, test, and build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /housing-market-lab
        run: |
          npm run lint
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  data-health:
    name: Check data freshness and repeated update failures
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Enforce data health independently of deployment
        env:
          HEALTH_ATTENTION: ${{ needs.build.outputs.health_attention }}
        run: |
          if [ "$HEALTH_ATTENTION" != "false" ]; then
            echo "::error::Data health needs attention. See the build job's Data health summary. Validated releases can still deploy."
            exit 1
          fi
