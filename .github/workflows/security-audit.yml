name: Dependency security audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "47 16 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Check the complete dependency lockfile
        run: npm audit --package-lock-only --audit-level=moderate
