name: Dependency security audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
      - scripts/security-audit.mjs
      - patches/**
      - tests/security-*.test.mjs
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
      - scripts/security-audit.mjs
      - patches/**
      - tests/security-*.test.mjs
  workflow_dispatch:
  schedule:
    - cron: "47 16 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test audit failure handling
        run: node --test tests/security-*.test.mjs
      - name: Check the complete dependency lockfile
        run: npm run audit:security
      - name: Preserve the unfiltered npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-audit
          path: security-audit.json
          retention-days: 30
